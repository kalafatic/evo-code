<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVO-Code — Darwin Code</title>
    <link rel="stylesheet" href="shared/shell.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar">
    <div class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name">EVO-Code</span>
        <span class="brand-sub">Darwin Code</span>
    </div>
    <div class="topbar-center">
        <span id="top-workspace" class="top-item">no workspace</span>
        <span id="top-session" class="top-item">no session</span>
        <span id="top-runtime" class="top-item">no default runtime</span>
    </div>
    <div class="topbar-right">
        <span id="frontend-build" class="build-badge" title="Frontend revision">web r7</span>
        <span id="connection-status" class="conn conn-disconnected" title="Server connection">● offline</span>
        <button id="btn-chat" class="btn btn-chat" title="Open the chat / inference view (Ctrl+Enter)">💬 Chat</button>
        <button id="btn-conn" class="btn btn-small" title="Connection state and diagnostics">connection</button>
        <button id="btn-auth" class="btn btn-small" title="Set server token">auth</button>
        <a id="btn-settings" class="btn btn-small" href="settings.html" title="Providers, models, runtimes, projects">settings</a>
        <button id="btn-theme" class="btn btn-small" title="Toggle light/dark theme (UPM design standard)">theme</button>
        <a id="btn-help" class="btn btn-small" href="help.html" target="_blank" rel="noopener" title="Help and documentation">help</a>
    </div>
</header>

<div id="main">
    <aside id="left-panel">
        <nav id="left-nav">
            <div class="nav-group-label">Assistant</div>
            <div class="nav-group">
                <button class="nav-btn nav-btn-chat" id="nav-chat" title="Ask the model (opens a chat tab)">💬 Chat</button>
            </div>
            <div class="nav-group-label">Workspace</div>
            <div class="nav-group">
                <button class="nav-btn active" data-view="workspace">Workspace</button>
                <button class="nav-btn" data-view="sessions">Sessions</button>
            </div>
            <div class="nav-group-label">Manage</div>
            <div class="nav-group">
                <button class="nav-btn" data-view="runtimes">Runtimes</button>
                <button class="nav-btn" data-view="models">Models</button>
                <button class="nav-btn" data-view="modelmanager">Model Manager</button>
                <button class="nav-btn" data-view="tools">Java Tools</button>
                <button class="nav-btn" data-view="activity">Activity</button>
            </div>
        </nav>
        <div id="left-content"></div>
    </aside>

    <section id="work-area">
        <div id="tabs-bar"></div>
        <div id="tab-content">
            <div id="placeholder" class="placeholder">
                <div class="placeholder-title">EVO-Code</div>
                <div class="placeholder-text">
                    Ask the model anything, or open a workspace to run coding tasks.<br>
                    <button id="placeholder-chat" class="btn btn-chat" style="margin-top:14px">💬 Start chatting</button>
                </div>
            </div>
        </div>
    </section>

    <aside id="right-panel">
        <div class="panel-title">Context</div>
        <div id="right-content" class="panel-scroll">
            <div class="empty-note">Select an item for details.</div>
        </div>
    </aside>
</div>

<footer id="bottom-panel">
    <div class="bottom-tabs">
        <button class="bottom-tab active" data-panel="console">Console</button>
        <button class="bottom-tab" data-panel="events">Events</button>
        <button class="bottom-tab" data-panel="problems">Problems</button>
        <span class="spacer"></span>
        <div id="console-controls" class="console-controls"></div>
    </div>
    <div id="bottom-content" class="bottom-content">
        <div id="panel-console" class="bottom-pane active"></div>
        <div id="panel-events" class="bottom-pane"></div>
        <div id="panel-problems" class="bottom-pane"></div>
    </div>
</footer>

<footer id="statusbar">
    <span id="sb-application" class="sb-item">DCODE</span>
    <span id="sb-version" class="sb-item">—</span>
    <span id="sb-connection" class="sb-item">offline</span>
    <span class="spacer"></span>
    <span id="sb-build" class="sb-item">web r7</span>
</footer>

<div id="modal-root"></div>
<div id="context-menu" class="context-menu hidden"></div>

<script src="js/api.js"></script>
<script src="js/sse.js"></script>
<script src="js/markdown.js"></script>
<script src="js/diff.js"></script>
<script src="js/explorer.js"></script>
<script src="js/editor.js"></script>
<script src="js/sessions.js"></script>
<script src="js/tooling.js"></script>
<script src="js/runtimes.js"></script>
<script src="js/models.js"></script>
<script src="js/chat.js"></script>
<script src="js/app.js"></script>
<script src="shared/shell.js"></script>
<script src="shared/shell-init.js"></script>
</body>
</html>
